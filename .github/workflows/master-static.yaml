name: Static checks on master
on:
  push: null
jobs:
  docker-image-for-linting:
    runs-on: ubuntu-24.04
    steps:
    - name: checkout
      uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true
    - name: Install GoReleaser
      uses: goreleaser/goreleaser-action@v6
      with:
        distribution: goreleaser
        version: latest
        install-only: true
    - name: build image
      run: make image
    - name: Save image
      run: 'docker save --output metacontroller-lint.tar localhost/metacontroller:dev

        '
      id: _bre_docker_image_for_linting
    - name: Load metacontroller images
      run: 'docker load --input metacontroller-lint.tar

        '
    - name: Trivy scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: localhost/metacontroller:dev
        format: sarif
        output: trivy-results.sarif
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: os,library
        severity: CRITICAL,HIGH
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: trivy-results.sarif
    - name: Load metacontroller images
      run: 'docker load --input metacontroller-lint.tar

        '
      if: '!cancelled() && steps._bre_docker_image_for_linting.conclusion == ''success'''
    - name: Dockle scan
      uses: erzz/dockle-action@v1
      with:
        image: localhost/metacontroller:dev
        report-format: sarif
        report-name: dockle-report
      if: '!cancelled() && steps._bre_docker_image_for_linting.conclusion == ''success'''
    - name: Upload SARIF file
      uses: github/codeql-action/upload-sarif@v3
      if: (!cancelled() && steps._bre_docker_image_for_linting.conclusion == 'success') && (always())
      with:
        sarif_file: dockle-report.sarif
